[project]
name = "speechtranscribe"
version = "0.1.0"
description = "On-device multilingual speech-to-text built with Flet and ONNX Runtime"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=1.0.5",
    "flet-audio-recorder>=1.0.5",
    "flet-audio>=1.0.5",
    "onnxruntime==1.27.0",
    "tokenizers>=0.23.1",
    "numpy>=2.2,<2.5",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.5",
    "flet-desktop>=1.0.5",
    "flet-web>=1.0.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "com.panger"
product = "speechtranscribe"
company = "Panger"
copyright = "Copyright (C) 2026 by Panger"
# flet-audio is a "full" flavor package, not "light".
desktop_flavor = "full"
# Android/iOS/macOS microphone permission; also adds RECORD_AUDIO to the
# Android manifest and NSMicrophoneUsageDescription to the Apple info plists.
permissions = ["microphone"]

[tool.flet.app]
path = "src"
# Paths are relative to src/ and matched exactly (no globs). Hugging Face
# download metadata is 68 KB of noise and must not ship. The weights themselves
# stay in src/assets/models/.
exclude = ["assets/models/qwen3-asr-0.6b-int4/.cache"]

[tool.flet.android]
# onnxruntime==1.27.0 on pypi.flet.dev has no armeabi-v7a wheel, so a
# multi-ABI default build fails while installing requirements.
target_arch = ["arm64-v8a"]

[tool.flet.android.permission]
"android.permission.RECORD_AUDIO" = true
"android.permission.MODIFY_AUDIO_SETTINGS" = true

[tool.flet.ios.info]
NSMicrophoneUsageDescription = "SpeechTranscribe records audio to transcribe it on your device."

[tool.flet.macos.info]
NSMicrophoneUsageDescription = "SpeechTranscribe records audio to transcribe it on your device."

[tool.flet.macos.entitlement]
"com.apple.security.device.audio-input" = true

[tool.flet.web.app]
# Pyodide has no onnxruntime. Static web builds must not carry the weights.
# (Dynamic web builds run Python on the server and can use them.)
exclude = ["assets/models"]
